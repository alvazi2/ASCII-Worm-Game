<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worm</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #0b0f0a;
    color: #33ff66;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #screen {
    margin: 0;
    white-space: pre;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    font-size: clamp(6px, 1.9vw, 18px);
    line-height: 1.15;
    letter-spacing: 0;
    text-shadow: 0 0 4px rgba(51, 255, 102, 0.45);
  }
</style>
</head>
<body>
<pre id="screen" aria-label="Worm game screen"></pre>
<script>
"use strict";

// Screen and playfield geometry (SPEC.md sections 3-4).
const COLS = 80;
const ROWS = 25;
const LEFT = 0;
const RIGHT = COLS - 1;   // 79
const TOP = 0;
const BOTTOM = 22;
const STATUS_ROW = 24;

const key = (x, y) => x + "," + y;
const isBorder = (x, y) => x === LEFT || x === RIGHT || y === TOP || y === BOTTOM;
const isInterior = (x, y) => x > LEFT && x < RIGHT && y > TOP && y < BOTTOM;

const HEAD_CH = "@";
const FOOD_CH = "*";
const WALL_CH = "█";   // CP437 full block: fills the cell, so the wall reads as thick

// The body is drawn as a bending line in the same box-drawing set as the walls (SPEC.md 3.1).
// Each segment's glyph comes from a bitmask of the directions it connects to.
const DIR_N = 1, DIR_S = 2, DIR_W = 4, DIR_E = 8;
const SEGMENT_GLYPHS = {
  [DIR_N | DIR_S]: "║",
  [DIR_E | DIR_W]: "═",
  [DIR_S | DIR_E]: "╔",
  [DIR_S | DIR_W]: "╗",
  [DIR_N | DIR_E]: "╚",
  [DIR_N | DIR_W]: "╝",
  [DIR_N]: "║",   // tail pieces: only one neighbour, so take that axis' straight piece
  [DIR_S]: "║",
  [DIR_E]: "═",
  [DIR_W]: "═",
};

const GROWTH_PER_FOOD = 4;
const FOOD_POINTS = 10;
const LEVEL_BONUS = 100;
const CLEARED_PAUSE_MS = 1200;

// The game is ten levels long. Levels 1-9 ramp to the 60ms floor, landing on it exactly at 9;
// level 10 drops back to level 1's speed and lays its asterisks out as a peace sign (SPEC.md 6.11).
const FINAL_LEVEL = 10;
const FINAL_LEVEL_GROWTH_LIMIT = 10;   // asterisks that still grow the worm on the last level

// Peace sign: an ellipse of 17 x 8.5 cells (character cells are ~2:1, so that reads as a circle),
// a vertical stroke down its diameter, and two strokes to the lower left and right. The diagonals
// run 2 cells across per 1 down so they look like 45 degrees, and are 2 cells wide to match the
// weight of the vertical. Everything is clipped to the circle.
function peaceSignCells() {
  const cx = 39, cy = 11, rx = 17, ry = 8.5;
  const cells = new Set();
  const radius = (x, y) => Math.hypot((x - cx) / rx, (y - cy) / ry);
  const add = (x, y) => { if (isInterior(x, y)) cells.add(key(x, y)); };

  for (let y = TOP + 1; y < BOTTOM; y++) {
    for (let x = LEFT + 1; x < RIGHT; x++) {
      if (Math.abs(radius(x, y) - 1) < 0.055) add(x, y);
    }
  }
  for (let y = Math.round(cy - ry); y <= Math.round(cy + ry); y++) {
    if (radius(cx, y) <= 1.02) add(cx, y);
  }
  for (let i = 1; ; i++) {
    const y = cy + i, xl = cx - 2 * i, xr = cx + 2 * i;
    const left = radius(xl, y) <= 1.02, right = radius(xr, y) <= 1.02;
    if (!left && !right) break;
    if (left) { add(xl, y); add(xl + 1, y); }
    if (right) { add(xr, y); add(xr - 1, y); }
  }
  return cells;
}

const PEACE_SIGN = peaceSignCells();

// Test mode (SPEC.md 10): a `level` query parameter in range starts the game there and enables the
// test keys. Takes the query string rather than reading location itself, so it is checkable without
// a browser. Anything unparseable or out of range returns null, which means an ordinary game.
function parseTestLevel(search) {
  for (const pair of String(search || "").replace(/^\?/, "").split("&")) {
    const [name, value] = pair.split("=");
    if (name !== "level") continue;
    if (!/^\d+$/.test(value || "")) return null;
    const level = Number(value);
    return level >= 1 && level <= FINAL_LEVEL ? level : null;
  }
  return null;
}

const foodCount = (level) => (level === FINAL_LEVEL ? PEACE_SIGN.size : 3 + 2 * level);
const tickMs = (level) => (level === FINAL_LEVEL ? 180 : Math.max(60, 195 - 15 * level));

// Title and help screens (SPEC.md sections 6.8-6.9). Keep every line under 60 characters so a
// centred block never reaches the border.
const TITLE_LINES = [
  "W O R M",
  "",
  "a text-mode worm game, IBM PC circa 1984",
  "",
  "Eat every asterisk, then escape through",
  "the opening that appears in the wall.",
  "",
  "S  start          H  help",
];

// Two columns padded to a common width, so centring the block keeps the key columns aligned
// instead of centring each row independently.
const KEY_ROWS = [
  ["←  turn left", "→  turn right"],
  ["SPACE  pause or resume", "S  start a new game"],
  ["R  restart after game over", "H  this screen"],
  ["ESC  close this screen", ""],
];
const KEY_COL = 28;
const KEY_WIDTH = Math.max(...KEY_ROWS.map((r) => KEY_COL + r[1].length));
const keyLines = KEY_ROWS.map(([left, right]) =>
  (left + " ".repeat(Math.max(1, KEY_COL - left.length)) + right).padEnd(KEY_WIDTH)
);

const HELP_LINES = [
  "H E L P",
  "",
  "The worm never stops moving. The arrow keys turn it",
  "left or right relative to the way it already heads —",
  "they do not steer it to a fixed compass point.",
  "",
  "Eat every * to open a gap in the wall, then drive the",
  "worm out through the gap to finish the level. Each",
  "level adds more asterisks and moves faster.",
  "",
  "Hitting a wall or your own body ends the game.",
  "",
  keyLines[0],
  keyLines[1],
  keyLines[2],
  keyLines[3],
  "",
  "An asterisk scores 10; finishing level N scores N x 100.",
];

const screenEl = document.getElementById("screen");

const state = {
  worm: [],
  heading: { dx: 1, dy: 0 },
  pendingTurn: 0,
  growth: 0,
  food: new Set(),
  exit: null,
  level: 1,
  score: 0,
  phase: "title",
  resumePhase: "title",
  eaten: 0,
  interval: tickMs(1),
  testMode: false,       // set once at boot from the URL, never toggled at runtime
  startAtLevel: 1,       // the level a new game begins at
  invincible: false,     // test mode only, toggled with I
};

let accumulator = 0;
let lastFrame = 0;
let clearedAt = 0;

// --- setup -----------------------------------------------------------------

function placeFood(count) {
  const occupied = new Set(state.worm.map((s) => key(s.x, s.y)));
  state.food.clear();

  // The last level is a fixed pattern rather than random placement (SPEC.md 6.11).
  if (state.level === FINAL_LEVEL) {
    for (const k of PEACE_SIGN) if (!occupied.has(k)) state.food.add(k);
    return;
  }

  let guard = 0;
  while (state.food.size < count && guard++ < 100000) {
    const x = 1 + Math.floor(Math.random() * (RIGHT - 1));
    const y = 1 + Math.floor(Math.random() * (BOTTOM - 1));
    const k = key(x, y);
    if (occupied.has(k) || state.food.has(k)) continue;
    state.food.add(k);
  }
}

function startLevel() {
  const y = Math.round((1 + (BOTTOM - 1)) / 2);
  const headX = 10;
  state.worm = [];
  for (let i = 0; i < 5; i++) state.worm.push({ x: headX - i, y: y });
  state.heading = { dx: 1, dy: 0 };
  state.pendingTurn = 0;
  state.growth = 0;
  state.eaten = 0;
  state.exit = null;
  state.phase = "playing";
  state.interval = tickMs(state.level);
  placeFood(foodCount(state.level));
  accumulator = 0;
}

function restart() {
  state.level = state.startAtLevel;
  state.score = 0;
  startLevel();
}

function enableTestMode(level) {
  if (level === null) return;
  state.testMode = true;
  state.startAtLevel = level;
}

function jumpLevel(delta) {
  state.level = Math.min(FINAL_LEVEL, Math.max(1, state.level + delta));
  startLevel();                          // no level bonus: a jump is not a completion
}

function showTitle() {
  restart();
  state.phase = "title";
  state.resumePhase = "title";
}

function togglePause() {
  if (state.phase === "playing") {
    state.phase = "paused";
  } else if (state.phase === "paused") {
    state.phase = "playing";
    accumulator = 0;                     // time spent paused must not bank up ticks
  }
}

function openHelp() {
  if (state.phase === "help") return;
  state.resumePhase = state.phase;
  state.phase = "help";
}

function closeHelp() {
  if (state.phase !== "help") return;
  state.phase = state.resumePhase;
  accumulator = 0;                       // a long look at help must not bank up ticks
  if (state.phase === "cleared") clearedAt = performance.now();
}

// --- rules -----------------------------------------------------------------

function applyTurn() {
  const { dx, dy } = state.heading;
  if (state.pendingTurn === 1) {
    state.heading = { dx: -dy, dy: dx };          // clockwise
  } else if (state.pendingTurn === -1) {
    state.heading = { dx: dy, dy: -dx };          // counter-clockwise
  }
  state.pendingTurn = 0;
}

function openExit() {
  const candidates = [];
  for (let x = 1; x < RIGHT; x++) {
    candidates.push({ x: x, y: TOP });
    candidates.push({ x: x, y: BOTTOM });
  }
  for (let y = 1; y < BOTTOM; y++) {
    candidates.push({ x: LEFT, y: y });
    candidates.push({ x: RIGHT, y: y });
  }
  state.exit = candidates[Math.floor(Math.random() * candidates.length)];
}

function hitsSelf(x, y) {
  // The tail cell is vacated on this same tick, so it only blocks while growing.
  const limit = state.worm.length - (state.growth === 0 ? 1 : 0);
  for (let i = 0; i < limit; i++) {
    if (state.worm[i].x === x && state.worm[i].y === y) return true;
  }
  return false;
}

function tick() {
  applyTurn();

  const head = state.worm[0];
  const nx = head.x + state.heading.dx;
  const ny = head.y + state.heading.dy;

  if (state.exit && nx === state.exit.x && ny === state.exit.y) {
    state.score += state.level * LEVEL_BONUS;
    if (state.level === FINAL_LEVEL) {
      state.phase = "won";
    } else {
      state.phase = "cleared";
      clearedAt = performance.now();
    }
    return;
  }
  if (isBorder(nx, ny)) {
    // Invulnerable, a wall refuses the move rather than killing: stepping onto the border would
    // draw the worm over the wall glyphs and could carry it out of the field (SPEC.md 10.4).
    if (state.invincible) return;
    state.phase = "dead";
    return;
  }
  if (hitsSelf(nx, ny) && !state.invincible) {
    state.phase = "dead";
    return;
  }

  state.worm.unshift({ x: nx, y: ny });
  if (state.growth > 0) state.growth--;
  else state.worm.pop();

  const k = key(nx, ny);
  if (state.food.has(k)) {
    state.food.delete(k);
    state.eaten++;
    state.score += FOOD_POINTS;
    // On the last level only the first few asterisks grow the worm, so tracing the shape stays a
    // lap of honour rather than a survival test (SPEC.md 6.11).
    if (state.level !== FINAL_LEVEL || state.eaten <= FINAL_LEVEL_GROWTH_LIMIT) {
      state.growth += GROWTH_PER_FOOD;
    }
  }

  if (state.food.size === 0 && !state.exit) openExit();
}

// --- rendering -------------------------------------------------------------

function blankGrid() {
  const grid = new Array(ROWS);
  for (let y = 0; y < ROWS; y++) grid[y] = new Array(COLS).fill(" ");
  return grid;
}

function drawBorder(grid) {
  for (let x = LEFT; x <= RIGHT; x++) {
    grid[TOP][x] = WALL_CH;
    grid[BOTTOM][x] = WALL_CH;
  }
  for (let y = TOP; y <= BOTTOM; y++) {
    grid[y][LEFT] = WALL_CH;
    grid[y][RIGHT] = WALL_CH;
  }
}

function writeCentered(grid, row, text) {
  const padded = " " + text + " ";
  const start = Math.max(0, Math.floor((COLS - padded.length) / 2));
  for (let i = 0; i < padded.length && start + i < COLS; i++) {
    grid[row][start + i] = padded[i];
  }
}

function writeBlock(grid, lines) {
  const start = Math.max(1, Math.floor((BOTTOM - lines.length) / 2));
  lines.forEach((line, i) => {
    if (line && start + i < BOTTOM) writeCentered(grid, start + i, line);
  });
}

// Which way `to` lies from `from`, as a direction bit. The two are always adjacent.
function linkBit(from, to) {
  if (to.y < from.y) return DIR_N;
  if (to.y > from.y) return DIR_S;
  if (to.x < from.x) return DIR_W;
  return DIR_E;
}

function bodyGlyph(i) {
  const seg = state.worm[i];
  let mask = 0;
  if (i > 0) mask |= linkBit(seg, state.worm[i - 1]);                    // toward the head
  if (i < state.worm.length - 1) mask |= linkBit(seg, state.worm[i + 1]); // toward the tail
  return SEGMENT_GLYPHS[mask] || "═";
}

function drawField(grid) {
  if (state.exit) grid[state.exit.y][state.exit.x] = " ";

  for (const k of state.food) {
    const [x, y] = k.split(",").map(Number);
    grid[y][x] = FOOD_CH;
  }

  for (let i = state.worm.length - 1; i >= 0; i--) {
    const s = state.worm[i];
    if (isInterior(s.x, s.y)) grid[s.y][s.x] = i === 0 ? HEAD_CH : bodyGlyph(i);
  }

  if (state.phase === "cleared") {
    writeCentered(grid, Math.floor(BOTTOM / 2), "LEVEL " + state.level + " COMPLETE");
  } else if (state.phase === "dead") {
    writeCentered(grid, Math.floor(BOTTOM / 2), "GAME OVER — press R to restart");
  } else if (state.phase === "paused") {
    writeCentered(grid, Math.floor(BOTTOM / 2), "PAUSED — press SPACE to resume");
  }
}

function victoryLines() {
  return [
    "Y O U   W I N",
    "",
    "You cleared all " + FINAL_LEVEL + " levels and got the worm out alive.",
    "",
    "Final score   " + state.score,
    "",
    "press R to play again",
  ];
}

// A visible marker so a test-mode screenshot is never mistaken for a real run (SPEC.md 10.5).
function testMarker() {
  if (!state.testMode) return "";
  return state.invincible ? "   TEST NODIE" : "   TEST";
}

function statusText() {
  if (state.phase === "title") {
    return " Press S to start    H for help" +
           (state.testMode ? "    TEST level " + state.startAtLevel : "");
  }
  if (state.phase === "help") return " Press H or ESC to return" + testMarker();
  if (state.phase === "won") return " Press R to play again" + testMarker();
  return " Level " + state.level + "   Score " + state.score + "   Left " + state.food.size +
         testMarker();
}

function render() {
  const grid = blankGrid();
  drawBorder(grid);

  if (state.phase === "title") writeBlock(grid, TITLE_LINES);
  else if (state.phase === "help") writeBlock(grid, HELP_LINES);
  else if (state.phase === "won") writeBlock(grid, victoryLines());
  else drawField(grid);

  const status = statusText();
  for (let i = 0; i < status.length && i < COLS; i++) grid[STATUS_ROW][i] = status[i];

  screenEl.textContent = grid.map((row) => row.join("")).join("\n");
}

// --- loop and input --------------------------------------------------------

function frame(now) {
  const dt = Math.min(now - lastFrame, 250);   // ignore long gaps from a backgrounded tab
  lastFrame = now;

  if (state.phase === "playing") {
    accumulator += dt;
    while (accumulator >= state.interval) {
      accumulator -= state.interval;
      tick();
      if (state.phase !== "playing") break;
    }
  } else if (state.phase === "cleared" && now - clearedAt >= CLEARED_PAUSE_MS) {
    state.level++;
    startLevel();
  }

  render();
  requestAnimationFrame(frame);
}

// Dispatches a key name against the current phase (SPEC.md section 8). Kept separate from the
// listener so the acceptance checks can drive the keyboard headlessly. Returns true if the key
// was acted on.
function handleKey(k) {
  const lower = typeof k === "string" ? k.toLowerCase() : "";

  if (lower === "h") {
    if (state.phase === "help") closeHelp();
    else openHelp();
    return true;
  }

  if (state.phase === "help") {
    if (k === "Escape") { closeHelp(); return true; }
    return false;                        // help ignores every other key
  }

  if (k === " " && (state.phase === "playing" || state.phase === "paused")) {
    togglePause();
    return true;
  }

  if (state.phase === "title") {
    if (lower === "s") { restart(); return true; }
    return false;
  }

  if (state.phase === "dead" || state.phase === "won") {
    if (lower === "r") { restart(); return true; }
    return false;
  }

  if (state.phase === "playing") {
    if (k === "ArrowLeft") { state.pendingTurn = -1; return true; }
    if (k === "ArrowRight") { state.pendingTurn = 1; return true; }

    // Test keys report themselves unhandled unless test mode is on, so a player who has not
    // enabled it cannot tell they exist (SPEC.md 10.3). "=" and "_" are the unshifted twins.
    if (state.testMode) {
      if (k === "+" || k === "=") { jumpLevel(1); return true; }
      if (k === "-" || k === "_") { jumpLevel(-1); return true; }
      if (lower === "i") { state.invincible = !state.invincible; return true; }
    }
  }

  return false;
}

window.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;   // leave browser shortcuts alone
  const handled = handleKey(e.key);
  // arrows and space scroll the page, so block them whether or not the phase acted on them
  if (handled || e.key.indexOf("Arrow") === 0 || e.key === " ") e.preventDefault();
});

enableTestMode(parseTestLevel(location.search));
showTitle();
lastFrame = performance.now();
requestAnimationFrame(frame);
</script>
</body>
</html>
